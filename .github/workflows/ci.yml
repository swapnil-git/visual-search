name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all modules
        run: python -m compileall -q lambdas scripts tests app.py visual_search_stack.py
      - name: Offline tests (in-memory fakes, no AWS needed)
        run: python -I tests/test_logic.py

  cdk-synth:
    # Checks the infrastructure code builds a CloudFormation template (default AWS backends).
    runs-on: ubuntu-latest
    env:
      CDK_DEFAULT_ACCOUNT: "123456789012"
      CDK_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: npm install -g aws-cdk@2
      - run: cdk synth --quiet

  local-e2e:
    # Whole pipeline on in-memory adapters, using the committed feed in sample-data/: ingest -> search / inventory -> scored answers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt
      - run: pip install -r scripts/requirements-dev.txt
      - name: Start local API and run end-to-end test
        run: |
          python scripts/local_server.py --data sample-data --port 8080 > server.log 2>&1 &
          for i in $(seq 60); do curl -s localhost:8080/ > /dev/null && break; sleep 1; done
          python scripts/e2e_test.py --base http://localhost:8080/v1 --data sample-data --skip ocr
      - if: failure()
        run: cat server.log
